apiVersion: apps/v1
kind: Deployment
metadata:
  name: pekko-cdc-worker
  namespace: bigdata-lab
  labels: {app: pekko-cdc-worker}
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pekko-cdc-worker}}
  template:
    metadata: {labels: {app: pekko-cdc-worker}}
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector: {kubernetes.io/hostname: xjw}
      imagePullSecrets: [{name: xxt-harbor-pull}]
      containers:
        - name: cdc-worker
          image: pekko-cdc-worker:dev
          imagePullPolicy: IfNotPresent
          command: ["/opt/docker/bin/pekko-cdc-worker"]
          envFrom: [{secretRef: {name: pekko-cdc-runtime-config}}]
          env:
            - name: JAVA_OPTS
              value: "-Dconfig.file=/opt/docker/conf/application-cdc-worker.conf"
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_HOST}}
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_PORT}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_DATABASE}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_PASSWORD}}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: config, mountPath: /opt/docker/conf/application-cdc-worker.conf, subPath: application-cdc-worker.conf, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe: {exec: {command: ["/bin/sh", "-c", "test -r /proc/1/cmdline"]}, initialDelaySeconds: 30, periodSeconds: 10}
          readinessProbe: {exec: {command: ["/bin/sh", "-c", "test -r /proc/1/cmdline"]}, initialDelaySeconds: 15, periodSeconds: 5}
      volumes:
        - {name: config, configMap: {name: pekko-cdc-worker-config}}
