name: cdc-runtime

on:
  push:
    branches: [main, feature/pekkosync-mvp-cleanup-datafusion]
    paths:
      - 'server/**'
      - 'build.sbt'
      - 'project/**'
      - 'deploy/kubernetes/bigdata-lab/cdc-runtime/**'
      - '.github/workflows/cdc-runtime.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Apply the isolated cdc-runtime kustomization (never the legacy Workflow StatefulSet)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt 'project pekko-server' 'set Test / testOptions := Seq()' test

  image:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sbt 'project pekko-server' dockerBuild
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/cdc-runtime:${GITHUB_SHA}"
          docker tag pekko-reference:0.1 "$image"
          docker push "$image"

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: image
    runs-on: ubuntu-24.04
    environment: cdc-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p "$RUNNER_TEMP/kube"
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Validate isolated manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/cdc-runtime:${GITHUB_SHA}"
          kubectl kustomize deploy/kubernetes/bigdata-lab/cdc-runtime \
            | sed "s#ghcr.io/xuxiaotuan/pekko-reference/cdc-runtime:dev#$image#g" \
            | kubectl apply --dry-run=server -f -
      - name: Apply isolated CDC Runtime only
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/cdc-runtime:${GITHUB_SHA}"
          kubectl kustomize deploy/kubernetes/bigdata-lab/cdc-runtime \
            | sed "s#ghcr.io/xuxiaotuan/pekko-reference/cdc-runtime:dev#$image#g" \
            | kubectl apply --server-side --field-manager=cdc-runtime-pipeline -f -
          kubectl -n bigdata-lab rollout status deployment/pekko-cdc-runtime --timeout=180s
