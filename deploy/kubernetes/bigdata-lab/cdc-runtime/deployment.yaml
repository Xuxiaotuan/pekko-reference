apiVersion: apps/v1
kind: Deployment
metadata:
  name: pekko-cdc-runtime
  namespace: bigdata-lab
  labels: {app: pekko-cdc-runtime}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: pekko-cdc-runtime}
  template:
    metadata:
      labels: {app: pekko-cdc-runtime}
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector: {kubernetes.io/hostname: xjw}
      containers:
        - name: cdc-runtime
          image: pekko-reference:cluster-runtime-20261113k
          imagePullPolicy: IfNotPresent
          # The generated launcher is a shell script.  Make the JVM PID 1 so
          # Kubernetes termination reaches CoordinatedShutdown instead of
          # leaving the binlog session behind until SIGKILL.
          command: ["/opt/docker/bin/pekko-reference", "-main", "cn.xuyinyin.magic.cdc.runtime.CdcRuntime"]
          envFrom:
            - secretRef: {name: pekko-cdc-runtime-config}
          env:
            - name: JAVA_OPTS
              value: "-Dconfig.file=/opt/docker/conf/application-cdc-runtime.conf"
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_HOST}}
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_PORT}}
            - name: DB_NAME
              value: "cdc_runtime"
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: pekko-cdc-runtime-config, key: CDC_STATE_PASSWORD}}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - name: config
              mountPath: /opt/docker/conf/application-cdc-runtime.conf
              subPath: application-cdc-runtime.conf
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          # The runtime deliberately binds its management API to loopback.
          # Keep probes inside the container; exposing it through the Service
          # requires a separate authenticated management proxy.
          # The API intentionally binds loopback. Pod-IP probes cannot reach it;
          # these probes certify process lifetime only. API readiness is checked
          # through a local port-forward in the acceptance procedure.
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -r /proc/1/cmdline"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -r /proc/1/cmdline"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          configMap: {name: pekko-cdc-runtime-config}
