apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bigdata-lab
resources:
  - capture-deployment.yaml
  - worker-deployment.yaml
  - worker-service.yaml
  - worker-hpa.yaml
configMapGenerator:
  - name: pekko-cdc-capture-config
    files:
      - application-cdc-runtime.conf
  - name: pekko-cdc-worker-config
    files:
      - application-cdc-worker.conf
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: pekko-cdc-capture
    newName: ghcr.io/xuxiaotuan/pekko-reference/cdc-capture
    newTag: dev
  - name: pekko-cdc-worker
    newName: ghcr.io/xuxiaotuan/pekko-reference/cdc-worker
    newTag: dev
