apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bigdata-lab
resources:
  - service.yaml
  - deployment.yaml
configMapGenerator:
  - name: pekko-cdc-runtime-config
    files:
      - application-cdc-runtime.conf
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: pekko-cdc-runtime
    newName: ghcr.io/xuxiaotuan/pekko-reference/cdc-runtime
    newTag: dev
