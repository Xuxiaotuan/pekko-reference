include classpath("application-prod.conf")

# This is a CDC-only entry. It does not enable Workflow Sharding, Cron, or the UI.
pekko.actor.provider = local
pekko.cluster.seed-nodes = []
pekko.cluster.min-nr-of-members = 1
pekko.cdc-standalone.http.host = "127.0.0.1"
pekko.cdc-standalone.http.port = 8080

pekko.workflow.mysql-cdc.state-jdbc {
  url = "jdbc:mysql://${?CDC_STATE_HOST}:${?CDC_STATE_PORT}/${?CDC_STATE_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC"
  username = ${?CDC_STATE_USER}
  password = ${?CDC_STATE_PASSWORD}
  offset-table = "capture_offsets"
  history-table = "capture_history"
  offset-flush-interval-ms = 1000
}

pekko.workflow.cdc-platform {
  enabled = true
  poll-interval-ms = 250
  snapshot-steps = 2
  tail-steps = 2
  captures = [
    {
      id = "primary"
      host = ${CDC_SOURCE_HOST}
      port = ${CDC_SOURCE_PORT}
      database = ${CDC_SOURCE_DATABASE}
      username = ${CDC_SOURCE_USER}
      password = ${CDC_SOURCE_PASSWORD}
      server-id = 18501
      source-lineage = ${CDC_SOURCE_LINEAGE}
      state-lineage = ${CDC_STATE_LINEAGE}
      sdk-state-username = ${CDC_STATE_SDK_USER}
      sdk-state-password = ${CDC_STATE_SDK_PASSWORD}
      exclusive-sdk-accounts = true
      source-fence-v2 = false
      batch-size = 128
    }
  ]
}

# Explicit opt-in only. The source/state credentials and UUIDs are supplied by
# the deployment Secret; no secret is stored in this ConfigMap.
