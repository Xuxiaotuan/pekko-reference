apiVersion: v1
kind: ServiceAccount
metadata:
  name: pekko-workflow
  namespace: bigdata-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pekko-workflow-pod-reader
  namespace: bigdata-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pekko-workflow-pod-reader
  namespace: bigdata-lab
subjects:
  - kind: ServiceAccount
    name: pekko-workflow
    namespace: bigdata-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pekko-workflow-pod-reader
