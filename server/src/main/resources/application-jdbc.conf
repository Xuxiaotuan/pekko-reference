# Shared JDBC persistence settings. Environment-specific database settings live
# in application-prod.conf, application-dev.conf, and application-test.conf.
pekko {
  persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
  }
}

pekko-persistence-jdbc.shared-databases.slick {
  db {
    connectionPool = "HikariCP"
    numThreads = 8
    maxConnections = 8
    minConnections = 1
  }
}

jdbc-journal {
  use-shared-db = "slick"
  tables {
    event_journal.schemaName = ""
    event_tag.schemaName = ""
  }
}

jdbc-snapshot-store {
  use-shared-db = "slick"
  tables.snapshot.schemaName = ""
}

jdbc-read-journal {
  use-shared-db = "slick"
}
