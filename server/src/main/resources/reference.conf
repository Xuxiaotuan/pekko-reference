    "cn.xuyinyin.magic.workflow.engine.ExecutionFailure" = "cn.xuyinyin.magic.cdc.recovery.LegacyExecutionFailureMigration"
    "cn.xuyinyin.magic.workflow.bootstrap.BootstrapJournal$Advanced" = "cn.xuyinyin.magic.cdc.bootstrap.LegacyBootstrapAdvancedMigration"
    "cn.xuyinyin.magic.workflow.bootstrap.BootstrapProgress" = "cn.xuyinyin.magic.cdc.bootstrap.LegacyBootstrapProgressMigration"
