  pekko-sys = "pekko-cluster-system"
  project-version = "0.1"

  log-dead-letters = 1
  log-dead-letters-suspend-duration = 25 minutes
  coordinated-shutdown.exit-jvm = off
  dispatcher {
    # default dispatcher.
    default {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 2
        parallelism-max = 32
        parallelism-factor = 2.0
      }
      throughput = 100
    }
  }
  actor {
    provider = cluster

    serializers {
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
      jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
    }
    serialization-bindings {
      "cn.xuyinyin.magic.common.CborSerializable" = jackson-cbor
    }
  }

  cluster {
    seed-nodes = ["pekko://"${pekko.pekko-sys}"@127.0.0.1:2551"]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    shutdown-after-unsuccessful-join-seed-nodes = 30s
    # server、dispatcher、worker
    roles = ["server-all"]
    internal-dispatcher = pekko.dispatcher.default
  }
  remote.artery {
     canonical.hostname = "127.0.0.1"
     canonical.port = 2551
  }

  workflow {
    readiness-timeout = 2s
    cdc-recovery {
      max-auto-recoveries = 3
      initial-backoff = 1s
    }
    cluster-bootstrap {
      enabled = false
    }
  }
}

# Bound admitted HTTP requests during CoordinatedShutdown.
http.shutdown-grace = 5s

# Leave a distinct outer phase budget around the HTTP hard deadline.
pekko.coordinated-shutdown.phases.service-requests-done.timeout = 10s

# Opt-in single-owner CDC control plane. Capture definitions and all credentials
# belong in deployment config/environment, never in API task payloads.
pekko.workflow.cdc-platform {
  enabled = false
  snapshot-steps = 2
  tail-steps = 2
  candidate-page = 32
  max-pending-operations = 64
  poll-interval-ms = 100
  tail-delay-ms = 500
  captures = []
}
