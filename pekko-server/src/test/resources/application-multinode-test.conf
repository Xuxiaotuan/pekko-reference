include classpath("application-test.conf")

pekko {
  actor {
    provider = "cluster"
    serialization-bindings {
      "cn.xuyinyin.magic.common.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    enabled = true
    transport = tcp
    canonical {
      hostname = "127.0.0.1"
      port = 0
    }
  }

  cluster {
    jmx.multi-mbeans-in-same-jvm = on
    seed-nodes = []
    roles = ["worker", "coordinator"]
    min-nr-of-members = 1
    auto-down-unreachable-after = off
    shutdown-after-unsuccessful-join-seed-nodes = off

    failure-detector {
      acceptable-heartbeat-pause = 1s
      threshold = 4.0
    }

    sharding {
      number-of-shards = 10
      role = "worker"
      remember-entities = on
      remember-entities-store = "eventsourced"
      rebalance-interval = 1s
      waiting-for-state-timeout = 5s
      updating-state-timeout = 5s
    }
  }

  coordinated-shutdown.exit-jvm = off
  loglevel = "WARNING"
  stdout-loglevel = "WARNING"
}
