# 生产环境配置
# 使用方式: -Dconfig.resource=application-prod.conf

include "application.conf"
include "application-jdbc.conf"

pekko {
  # 生产环境系统名称
  pekko-sys = "pekko-cluster-system-prod"

  # 独立生产进程在协调关闭完成后退出 JVM；库默认、开发和测试配置保持关闭。
  coordinated-shutdown.exit-jvm = on
  
  # 集群配置
  cluster {
    seed-nodes = [
      "pekko://pekko-cluster-system-prod@node1:2551",
      "pekko://pekko-cluster-system-prod@node2:2551",
      "pekko://pekko-cluster-system-prod@node3:2551"
    ]
    # 生产环境种子节点（从环境变量读取）
    seed-nodes = ${?PEKKO_SEED_NODES}
    
    roles = ["coordinator", "worker", "api-gateway"]
    # 生产环境角色（从环境变量读取）
    roles = ${?PEKKO_ROLES}
    
    # 生产环境故障检测器配置
    failure-detector {
      acceptable-heartbeat-pause = 5s
      threshold = 12.0
    }
    
    # 生产环境禁用自动downing（使用Split Brain Resolver）
    auto-down-unreachable-after = off
    
    # Split Brain Resolver配置
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver {
      active-strategy = "keep-majority"
      stable-after = 20s
    }
    
    # 最小成员数要求
    min-nr-of-members = 3
    
    # Cluster Sharding配置
    sharding {
      # 生产环境使用更多的分片
      number-of-shards = 100
      number-of-shards = ${?PEKKO_SHARDING_SHARDS}
      
      # 角色限制
      role = "worker"
      
      # 生产环境较长的Passivation时间
      passivate-idle-entity-after = 1h
      
      # Remember Entities
      remember-entities = on
      remember-entities-store = "eventsourced"
      
      # 生产环境再平衡配置
      rebalance-interval = 30s
      least-shard-allocation-strategy {
        rebalance-threshold = 5
        max-simultaneous-rebalance = 3
      }
      
      # 较长的超时时间
      waiting-for-state-timeout = 10s
      updating-state-timeout = 10s
    }
  }
  
  # 远程配置
  remote {
    artery {
      canonical {
        hostname = "0.0.0.0"
        # 从环境变量读取
        hostname = ${?PEKKO_HOSTNAME}
        port = 2551
        port = ${?PEKKO_PORT}
      }
      
      # 生产环境高级配置
      advanced {
        # 最大帧大小
        maximum-frame-size = 256 KiB
        # 缓冲池大小
        buffer-pool-size = 128
        # 最大并发流数
        maximum-large-frame-size = 2 MiB
      }
    }
  }
  
  # 工作流事件溯源配置
  workflow {
    event-sourcing {
      # 生产环境快照频率
      snapshot-every = 100
      snapshot-every = ${?PEKKO_WORKFLOW_SNAPSHOT_EVERY}
      
      # 保留快照数量
      keep-n-snapshots = 3
      keep-n-snapshots = ${?PEKKO_WORKFLOW_KEEP_SNAPSHOTS}
    }
  }
  
  # 日志配置（生产环境）
  loglevel = "INFO"
  loglevel = ${?PEKKO_LOG_LEVEL}
  
  stdout-loglevel = "INFO"
  
  # 生产环境日志配置
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  
  # 日志死信
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
}

pekko-persistence-jdbc.shared-databases.slick {
  profile = "slick.jdbc.MySQLProfile$"
  db {
    driver = "com.mysql.cj.jdbc.Driver"
    host = "localhost"
    host = ${?DB_HOST}
    port = 3306
    port = ${?DB_PORT}
    name = "pekko"
    name = ${?DB_NAME}
    url = "jdbc:mysql://"${pekko-persistence-jdbc.shared-databases.slick.db.host}":"${pekko-persistence-jdbc.shared-databases.slick.db.port}"/"${pekko-persistence-jdbc.shared-databases.slick.db.name}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
  }
}

# HTTP服务器配置
http {
  host = "0.0.0.0"
  host = ${?HTTP_HOST}
  
  port = 8080
  port = ${?HTTP_PORT}
  
  # 请求超时
  request-timeout = 30s
  
  # 绑定超时
  bind-timeout = 5s
}
